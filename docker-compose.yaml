networks:
  vps_net:
    name: vps_net
    driver: bridge

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASS}
      - POSTGRES_DB=default
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
    networks:
      - vps_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d default"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  valkey:
    image: docker.io/valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --requirepass ${VALKEY_PASS}
    volumes:
      - valkey_data:/data:Z
    networks:
      - vps_net
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a ${VALKEY_PASS} ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  valkey_data:
